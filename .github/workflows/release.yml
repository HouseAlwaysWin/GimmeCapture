name: Build and Release

on:
  push:
    tags:
      - 'v*'

# Read-only by default; only the job that publishes the release asks for write access, below.
permissions:
  contents: read

jobs:
  # Refuse to publish a release whose source does not say it is that release. v0.67.0-v0.67.2 and then
  # v0.68.1 were all tagged by hand on commits whose csproj still carried the previous version and whose
  # CHANGELOG had no section for them; the build injects the tag's version into the binaries, so nothing
  # ever looked wrong - until the next release.ps1 run attributed those changes to the wrong version.
  # release.ps1 always produces a commit that passes this; a hand-pushed tag has to as well.
  verify-release-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Tag must match the csproj Version and have a CHANGELOG section
      shell: bash
      run: |
        version="${GITHUB_REF_NAME#v}"
        csproj_version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/GimmeCapture/GimmeCapture.csproj | head -n 1)
        if [ "$csproj_version" != "$version" ]; then
          echo "::error::Tag $GITHUB_REF_NAME, but src/GimmeCapture/GimmeCapture.csproj says <Version>$csproj_version</Version>. Cut releases with release.ps1 instead of pushing a tag by hand."
          exit 1
        fi
        if ! grep -qF "## v$version " CHANGELOG.md && ! grep -qxF "## v$version" CHANGELOG.md; then
          echo "::error::CHANGELOG.md has no '## v$version' section. Cut releases with release.ps1 instead of pushing a tag by hand."
          exit 1
        fi
        echo "Release metadata OK: v$version"

  # Linux (net10.0 head) self-contained single-file build, alongside the Windows one; the release job at the end
  # collects both artifacts and publishes everything to one GitHub Release.
  build-linux:
    needs: verify-release-metadata
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    # Same cache shape as linux.yml: the bundled build is pinned inside the script,
    # so keying on the script hash invalidates exactly when the pinned build changes.
    - name: Cache FFmpeg .so bundle
      id: cache-ffmpeg
      uses: actions/cache@v6
      with:
        path: src/GimmeCapture/ffmpeg-lib
        key: ffmpeg-linux-so-${{ hashFiles('scripts/ensure-ffmpeg-libs-linux.sh') }}

    - name: Ensure bundled FFmpeg .so
      if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
      run: |
        chmod +x scripts/ensure-ffmpeg-libs-linux.sh
        scripts/ensure-ffmpeg-libs-linux.sh

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    # Only the net10.0 head runs on Linux (the net10.0-windows head is not built here). The lock
    # files pin both win-x64 and linux-x64 (Directory.Build.props RuntimeIdentifiers), so the
    # shipped Linux binary restores in locked mode like the Windows one.
    #
    # Restore separately in locked mode, then publish with --no-restore — the same split the Windows
    # job below uses. Letting `dotnet publish` do the restore itself re-resolves in the
    # self-contained + RID context, where the SDK injects an implicit Microsoft.NET.ILLink.Tasks
    # whose version tracks the installed SDK. That package is not in packages.lock.json, so locked
    # mode aborts the whole release with NU1004 (this is what broke v0.66.0). Pinning it in the lock
    # file would only move the break to the next SDK bump, since there is no global.json.
    # Properties/PublishProfiles/linux-x64.pubxml: a self-contained single file, which the updater swaps.
    - name: Publish application (self-contained, single file)
      run: |
        version="${GITHUB_REF_NAME#v}"
        core="${version%%-*}"
        IFS='.' read -r major minor patch <<< "$core"
        if [ -z "$major" ] || [ -z "$minor" ] || [ -z "$patch" ]; then
          echo "Tag version must contain major.minor.patch: $version" >&2
          exit 1
        fi
        asmver="$major.$minor.$patch.0"
        dotnet restore src/GimmeCapture/GimmeCapture.csproj --locked-mode --disable-parallel

        dotnet publish src/GimmeCapture/GimmeCapture.csproj \
          -f net10.0 -c Release -p:PublishProfile=linux-x64 --no-restore \
          -p:Version="$version" \
          -p:AssemblyVersion="$asmver" \
          -p:FileVersion="$asmver" \
          -p:InformationalVersion="$version" \
          -o ./publish-linux

    - name: Clean publish output
      run: |
        find ./publish-linux -name '*.pdb' -delete
        rm -f ./publish-linux/config.json

    - name: Package tarball
      run: |
        chmod +x ./publish-linux/GimmeCapture
        tar -C ./publish-linux -czf GimmeCapture_linux-x64.tar.gz .

    - name: Upload Linux artifact
      uses: actions/upload-artifact@v7
      with:
        name: linux-release
        path: GimmeCapture_linux-x64.tar.gz
        retention-days: 1

  # Windows: verify, then the self-contained folder, its zip and the installer. Runs alongside build-linux; it used to
  # wait for it.
  build-windows:
    needs: verify-release-metadata
    runs-on: windows-latest
    # A Windows build takes about 6 minutes. This only stops a hung one (a stuck choco install, say) from holding the
    # runner for the 6-hour default.
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    # Same cache keys as ci.yml, so a release run reuses the caches CI already populated.
    - name: Cache FFmpeg DLLs
      id: cache-ffmpeg
      uses: actions/cache@v6
      with:
        path: src/GimmeCapture/ffmpeg-lib
        key: ffmpeg-${{ hashFiles('scripts/ensure-ffmpeg-libs.ps1') }}

    - name: Ensure bundled FFmpeg DLLs
      if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
      shell: powershell
      run: powershell -ExecutionPolicy Bypass -File scripts/ensure-ffmpeg-libs.ps1

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    # -SkipPublish: verify's publish smokes would only repeat what this job publishes next, and what build-linux builds.
    - name: Verify
      shell: powershell
      run: powershell -ExecutionPolicy Bypass -File scripts/verify.ps1 -SkipPublish

    # Properties/PublishProfiles/win-x64.pubxml: a self-contained folder, which needs no .NET install. Not a single
    # file: that unpacked all of itself into %TEMP% on the first launch of every version.
    - name: Publish application (self-contained)
      run: |
        dotnet restore src/GimmeCapture/GimmeCapture.csproj --locked-mode --disable-parallel

        $version = "${{ github.ref_name }}".TrimStart('v')
        $coreVersion = $version.Split('-')[0]
        $parts = $coreVersion.Split('.')
        if ($parts.Count -ne 3) {
          throw "Tag version must contain major.minor.patch: $version"
        }
        $assemblyVersion = "$($parts[0]).$($parts[1]).$($parts[2]).0"
        $pub = @(
          '-c', 'Release'
          # Multi-target project (net10.0-windows;net10.0) since the Linux port — publish must name a
          # framework or dotnet errors NETSDK1129. The Windows artifact uses the Windows TFM.
          '-f', 'net10.0-windows10.0.19041.0'
          '-p:PublishProfile=win-x64'
          '--no-restore'
          "-p:Version=$version"
          "-p:AssemblyVersion=$assemblyVersion"
          "-p:FileVersion=$assemblyVersion"
          "-p:InformationalVersion=$version"
          '-o', './publish'
        )
        dotnet publish src/GimmeCapture/GimmeCapture.csproj @pub

    # Native packages may copy *.pdb next to the exe; they are not needed at runtime and bloat the zip.
    - name: Strip debug symbols from publish output
      shell: powershell
      run: |
        foreach ($dir in './publish') {
          if (Test-Path $dir) {
            Get-ChildItem -Path $dir -Filter *.pdb -Recurse -File -ErrorAction SilentlyContinue | Remove-Item -Force
          }
        }

    - name: Remove packaged default config
      shell: powershell
      run: |
        $configPath = Join-Path (Resolve-Path './publish') 'config.json'
        if (Test-Path $configPath) {
          Remove-Item $configPath -Force
        }

    - name: Zip the application
      run: |
        Compress-Archive -Path ./publish/* -DestinationPath GimmeCapture_win-x64.zip

    # Optional installer alongside the portable zip: an Inno Setup wizard that lets the user pick the install
    # drive/folder, adds Start-Menu/desktop shortcuts + an uninstaller. Per-user by default (no admin). The zip
    # + in-app auto-updater are unchanged.
    - name: Build Windows installer (Inno Setup)
      shell: powershell
      run: |
        # Pinned: an installer built by whatever Inno Setup is newest that day could change without a commit.
        choco install innosetup --version 6.7.1 --no-progress -y
        if ($LASTEXITCODE -ne 0) { throw "Inno Setup install failed ($LASTEXITCODE)" }
        $version = "${{ github.ref_name }}".TrimStart('v')
        $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
        if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
        $src = (Resolve-Path './publish').Path
        & $iscc "/DAppVersion=$version" "/DSourceDir=$src" installer\GimmeCapture.iss
        if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
        Get-ChildItem installer\output

    - name: Upload Windows artifact
      uses: actions/upload-artifact@v7
      with:
        name: windows-release
        path: |
          GimmeCapture_win-x64.zip
          installer/output/GimmeCapture_Setup_*.exe
        if-no-files-found: error
        retention-days: 1

  # Both builds done: checksums over everything, then one GitHub Release.
  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
    - name: Download Linux artifact
      uses: actions/download-artifact@v8
      with:
        name: linux-release
        path: .

    # Keeps the paths it was uploaded with: the zip at the top, the installer under installer/output.
    - name: Download Windows artifact
      uses: actions/download-artifact@v8
      with:
        name: windows-release
        path: .

    # One "<sha256>  <asset name>" line per asset, which the updater's ParseChecksum reads.
    - name: Generate checksum manifest
      shell: bash
      run: |
        set -euo pipefail
        {
          sha256sum GimmeCapture_win-x64.zip GimmeCapture_linux-x64.tar.gz
          (cd installer/output && sha256sum GimmeCapture_Setup_*.exe)
        } > SHA256SUMS.txt
        cat SHA256SUMS.txt

    # The only third-party action in any workflow, and it runs with write access to releases, so it is pinned to a
    # full commit SHA: a moved or hijacked tag cannot change what publishes the release. Dependabot updates the SHA
    # and the version comment together.
    - name: Create GitHub Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        files: |
          GimmeCapture_win-x64.zip
          GimmeCapture_linux-x64.tar.gz
          installer/output/GimmeCapture_Setup_*.exe
          SHA256SUMS.txt
        generate_release_notes: true
        prerelease: ${{ contains(github.ref_name, '-') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
