name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore src/GimmeCapture/GimmeCapture.csproj

    - name: Ensure bundled FFmpeg DLLs
      shell: powershell
      run: powershell -ExecutionPolicy Bypass -File scripts/ensure-ffmpeg-libs.ps1

    # Self-contained: largest but needs no .NET install. EnableCompressionInSingleFile shrinks the exe;
    # DebugType=none avoids shipping PDBs in the artifact.
    - name: Publish application (self-contained)
      run: |
        $version = "${{ github.ref_name }}".TrimStart('v')
        $pub = @(
          '-c', 'Release'
          '-r', 'win-x64'
          '--self-contained', 'true'
          '-p:PublishSingleFile=true'
          '-p:IncludeNativeLibrariesForSelfExtract=true'
          '-p:IncludeAllContentForSelfExtract=true'
          '-p:EnableCompressionInSingleFile=true'
          '-p:DebugType=none'
          '-p:DebugSymbols=false'
          "-p:Version=$version"
          '-o', './publish'
        )
        dotnet publish src/GimmeCapture/GimmeCapture.csproj @pub

    # Native packages may copy *.pdb next to the exe; they are not needed at runtime and bloat the zip.
    - name: Strip debug symbols from publish output
      shell: powershell
      run: |
        foreach ($dir in './publish') {
          if (Test-Path $dir) {
            Get-ChildItem -Path $dir -Filter *.pdb -Recurse -File -ErrorAction SilentlyContinue | Remove-Item -Force
          }
        }

    - name: Zip the application
      run: |
        Compress-Archive -Path ./publish/* -DestinationPath GimmeCapture_win-x64.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: GimmeCapture_win-x64.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
