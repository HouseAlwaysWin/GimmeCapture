name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # Linux (net10.0 head) self-contained single-file build. Runs first; the Windows job below
  # downloads its artifact and publishes everything to one GitHub Release.
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # Same cache shape as linux-tests.yml: the bundled build is pinned inside the script,
    # so keying on the script hash invalidates exactly when the pinned build changes.
    - name: Cache FFmpeg .so bundle
      id: cache-ffmpeg
      uses: actions/cache@v4
      with:
        path: src/GimmeCapture/ffmpeg-lib
        key: ffmpeg-linux-so-${{ hashFiles('scripts/ensure-ffmpeg-libs-linux.sh') }}

    - name: Ensure bundled FFmpeg .so
      if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
      run: |
        chmod +x scripts/ensure-ffmpeg-libs-linux.sh
        scripts/ensure-ffmpeg-libs-linux.sh

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    # Only the net10.0 head runs on Linux (the net10.0-windows head is not built here). The lock
    # files pin both win-x64 and linux-x64 (Directory.Build.props RuntimeIdentifiers), so the
    # shipped Linux binary restores in locked mode like the Windows one.
    - name: Publish application (self-contained, single file)
      run: |
        version="${GITHUB_REF_NAME#v}"
        core="${version%%-*}"
        IFS='.' read -r major minor patch <<< "$core"
        if [ -z "$major" ] || [ -z "$minor" ] || [ -z "$patch" ]; then
          echo "Tag version must contain major.minor.patch: $version" >&2
          exit 1
        fi
        asmver="$major.$minor.$patch.0"
        dotnet publish src/GimmeCapture/GimmeCapture.csproj \
          -f net10.0 -r linux-x64 -c Release --self-contained true \
          -p:RestoreLockedMode=true \
          -p:PublishSingleFile=true \
          -p:IncludeNativeLibrariesForSelfExtract=true \
          -p:IncludeAllContentForSelfExtract=true \
          -p:EnableCompressionInSingleFile=true \
          -p:DebugType=none \
          -p:DebugSymbols=false \
          -p:Version="$version" \
          -p:AssemblyVersion="$asmver" \
          -p:FileVersion="$asmver" \
          -p:InformationalVersion="$version" \
          -o ./publish-linux

    - name: Clean publish output
      run: |
        find ./publish-linux -name '*.pdb' -delete
        rm -f ./publish-linux/config.json

    - name: Package tarball
      run: |
        chmod +x ./publish-linux/GimmeCapture
        tar -C ./publish-linux -czf GimmeCapture_linux-x64.tar.gz .

    - name: Upload Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-release
        path: GimmeCapture_linux-x64.tar.gz
        retention-days: 1

  release:
    needs: build-linux
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # Same cache keys as ci.yml, so a release run reuses the caches CI already populated.
    - name: Cache FFmpeg DLLs
      id: cache-ffmpeg
      uses: actions/cache@v4
      with:
        path: src/GimmeCapture/ffmpeg-lib
        key: ffmpeg-${{ hashFiles('scripts/ensure-ffmpeg-libs.ps1') }}

    - name: Ensure bundled FFmpeg DLLs
      if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
      shell: powershell
      run: powershell -ExecutionPolicy Bypass -File scripts/ensure-ffmpeg-libs.ps1

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Verify
      shell: powershell
      run: powershell -ExecutionPolicy Bypass -File scripts/verify.ps1

    # Self-contained: largest but needs no .NET install. EnableCompressionInSingleFile shrinks the exe;
    # DebugType=none avoids shipping PDBs in the artifact.
    - name: Publish application (self-contained)
      run: |
        dotnet restore src/GimmeCapture/GimmeCapture.csproj --locked-mode --disable-parallel

        $version = "${{ github.ref_name }}".TrimStart('v')
        $coreVersion = $version.Split('-')[0]
        $parts = $coreVersion.Split('.')
        if ($parts.Count -ne 3) {
          throw "Tag version must contain major.minor.patch: $version"
        }
        $assemblyVersion = "$($parts[0]).$($parts[1]).$($parts[2]).0"
        $pub = @(
          '-c', 'Release'
          # Multi-target project (net10.0-windows;net10.0) since the Linux port — publish must name a
          # framework or dotnet errors NETSDK1129. The Windows artifact uses the Windows TFM.
          '-f', 'net10.0-windows10.0.19041.0'
          '-r', 'win-x64'
          '--self-contained', 'true'
          '--no-restore'
          '-p:PublishSingleFile=true'
          '-p:IncludeNativeLibrariesForSelfExtract=true'
          '-p:IncludeAllContentForSelfExtract=true'
          '-p:EnableCompressionInSingleFile=true'
          '-p:DebugType=none'
          '-p:DebugSymbols=false'
          "-p:Version=$version"
          "-p:AssemblyVersion=$assemblyVersion"
          "-p:FileVersion=$assemblyVersion"
          "-p:InformationalVersion=$version"
          '-o', './publish'
        )
        dotnet publish src/GimmeCapture/GimmeCapture.csproj @pub

    # Native packages may copy *.pdb next to the exe; they are not needed at runtime and bloat the zip.
    - name: Strip debug symbols from publish output
      shell: powershell
      run: |
        foreach ($dir in './publish') {
          if (Test-Path $dir) {
            Get-ChildItem -Path $dir -Filter *.pdb -Recurse -File -ErrorAction SilentlyContinue | Remove-Item -Force
          }
        }

    - name: Remove packaged default config
      shell: powershell
      run: |
        $configPath = Join-Path (Resolve-Path './publish') 'config.json'
        if (Test-Path $configPath) {
          Remove-Item $configPath -Force
        }

    - name: Zip the application
      run: |
        Compress-Archive -Path ./publish/* -DestinationPath GimmeCapture_win-x64.zip

    # Optional installer alongside the portable zip: an Inno Setup wizard that lets the user pick the install
    # drive/folder, adds Start-Menu/desktop shortcuts + an uninstaller. Per-user by default (no admin). The zip
    # + in-app auto-updater are unchanged.
    - name: Build Windows installer (Inno Setup)
      shell: powershell
      run: |
        choco install innosetup --no-progress -y
        if ($LASTEXITCODE -ne 0) { throw "Inno Setup install failed ($LASTEXITCODE)" }
        $version = "${{ github.ref_name }}".TrimStart('v')
        $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
        if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
        $src = (Resolve-Path './publish').Path
        & $iscc "/DAppVersion=$version" "/DSourceDir=$src" installer\GimmeCapture.iss
        if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
        Get-ChildItem installer\output

    # Pull in the Linux tarball built by the build-linux job so both platforms ship in one release.
    - name: Download Linux artifact
      uses: actions/download-artifact@v4
      with:
        name: linux-release
        path: .

    - name: Generate checksum manifest
      shell: powershell
      run: |
        $lines = @()
        $zipHash = (Get-FileHash GimmeCapture_win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
        $lines += "$zipHash  GimmeCapture_win-x64.zip"
        if (Test-Path GimmeCapture_linux-x64.tar.gz) {
          $lxHash = (Get-FileHash GimmeCapture_linux-x64.tar.gz -Algorithm SHA256).Hash.ToLowerInvariant()
          $lines += "$lxHash  GimmeCapture_linux-x64.tar.gz"
        }
        $setup = Get-ChildItem installer\output\GimmeCapture_Setup_*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($setup) {
          $setupHash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $lines += "$setupHash  $($setup.Name)"
        }
        $lines | Set-Content -Encoding ascii SHA256SUMS.txt

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          GimmeCapture_win-x64.zip
          GimmeCapture_linux-x64.tar.gz
          installer/output/GimmeCapture_Setup_*.exe
          SHA256SUMS.txt
        generate_release_notes: true
        prerelease: ${{ contains(github.ref_name, '-') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
