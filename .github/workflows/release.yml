name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Ensure bundled FFmpeg DLLs
      shell: powershell
      run: powershell -ExecutionPolicy Bypass -File scripts/ensure-ffmpeg-libs.ps1

    - name: Verify
      shell: powershell
      run: powershell -ExecutionPolicy Bypass -File scripts/verify.ps1

    # Self-contained: largest but needs no .NET install. EnableCompressionInSingleFile shrinks the exe;
    # DebugType=none avoids shipping PDBs in the artifact.
    - name: Publish application (self-contained)
      run: |
        dotnet restore src/GimmeCapture/GimmeCapture.csproj --locked-mode --runtime win-x64 --disable-parallel

        $version = "${{ github.ref_name }}".TrimStart('v')
        $coreVersion = $version.Split('-')[0]
        $parts = $coreVersion.Split('.')
        if ($parts.Count -ne 3) {
          throw "Tag version must contain major.minor.patch: $version"
        }
        $assemblyVersion = "$($parts[0]).$($parts[1]).$($parts[2]).0"
        $pub = @(
          '-c', 'Release'
          '-r', 'win-x64'
          '--self-contained', 'true'
          '--no-restore'
          '-p:PublishSingleFile=true'
          '-p:IncludeNativeLibrariesForSelfExtract=true'
          '-p:IncludeAllContentForSelfExtract=true'
          '-p:EnableCompressionInSingleFile=true'
          '-p:DebugType=none'
          '-p:DebugSymbols=false'
          "-p:Version=$version"
          "-p:AssemblyVersion=$assemblyVersion"
          "-p:FileVersion=$assemblyVersion"
          "-p:InformationalVersion=$version"
          '-o', './publish'
        )
        dotnet publish src/GimmeCapture/GimmeCapture.csproj @pub

    # Native packages may copy *.pdb next to the exe; they are not needed at runtime and bloat the zip.
    - name: Strip debug symbols from publish output
      shell: powershell
      run: |
        foreach ($dir in './publish') {
          if (Test-Path $dir) {
            Get-ChildItem -Path $dir -Filter *.pdb -Recurse -File -ErrorAction SilentlyContinue | Remove-Item -Force
          }
        }

    - name: Remove packaged default config
      shell: powershell
      run: |
        $configPath = Join-Path (Resolve-Path './publish') 'config.json'
        if (Test-Path $configPath) {
          Remove-Item $configPath -Force
        }

    - name: Zip the application
      run: |
        Compress-Archive -Path ./publish/* -DestinationPath GimmeCapture_win-x64.zip

    # Optional installer alongside the portable zip: an Inno Setup wizard that lets the user pick the install
    # drive/folder, adds Start-Menu/desktop shortcuts + an uninstaller. Per-user by default (no admin). The zip
    # + in-app auto-updater are unchanged.
    - name: Build Windows installer (Inno Setup)
      shell: powershell
      run: |
        choco install innosetup --no-progress -y
        if ($LASTEXITCODE -ne 0) { throw "Inno Setup install failed ($LASTEXITCODE)" }
        $version = "${{ github.ref_name }}".TrimStart('v')
        $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
        if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
        $src = (Resolve-Path './publish').Path
        & $iscc "/DAppVersion=$version" "/DSourceDir=$src" installer\GimmeCapture.iss
        if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
        Get-ChildItem installer\output

    - name: Generate checksum manifest
      shell: powershell
      run: |
        $lines = @()
        $zipHash = (Get-FileHash GimmeCapture_win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
        $lines += "$zipHash  GimmeCapture_win-x64.zip"
        $setup = Get-ChildItem installer\output\GimmeCapture_Setup_*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($setup) {
          $setupHash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $lines += "$setupHash  $($setup.Name)"
        }
        $lines | Set-Content -Encoding ascii SHA256SUMS.txt

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          GimmeCapture_win-x64.zip
          installer/output/GimmeCapture_Setup_*.exe
          SHA256SUMS.txt
        generate_release_notes: true
        prerelease: ${{ contains(github.ref_name, '-') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
