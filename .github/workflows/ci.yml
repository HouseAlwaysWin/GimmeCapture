name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Ensure bundled FFmpeg DLLs
      shell: powershell
      run: powershell -ExecutionPolicy Bypass -File scripts/ensure-ffmpeg-libs.ps1

    - name: Check localization parity
      shell: powershell
      run: powershell -ExecutionPolicy Bypass -File scripts/check-localization.ps1

    - name: Verify
      shell: powershell
      run: powershell -ExecutionPolicy Bypass -File scripts/verify.ps1

    - name: Upload coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: artifacts/verify/**/coverage/**
        if-no-files-found: ignore
