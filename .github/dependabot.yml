# Keeps the actions used by .github/workflows current — including the SHA-pinned one in release.yml, whose SHA and
# version comment Dependabot rewrites together. Minor and patch bumps arrive as one grouped PR a week. Each major
# bump gets a PR of its own: a major can change behaviour, and release.yml only runs on a tag push, so CI on the
# PR cannot vouch for anything that workflow uses.
#
# NuGet is not listed: Dependabot's NuGet updater cannot handle the projects that target both
# net10.0-windows10.0.19041.0 and net10.0. Its first run here (2026-10-22, PR #192) showed two faults:
# - It judged 16 of the 25 packages "not compatible" with the -windows framework, even at the version already in
#   use, so it found no update for Avalonia, LLamaSharp, Serilog and most of the rest.
# - A project with several target frameworks, one of them platform-specific, is restored one framework at a time
#   (/p:TargetFramework=...), and each restore rewrites packages.lock.json with that framework alone. The lock file
#   it committed had lost the net10.0 head, and CI's locked restore failed on it (NU1004).
# Vulnerable NuGet packages are still reported by Dependabot alerts, which is a repository setting.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
